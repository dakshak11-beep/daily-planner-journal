<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522"><meta name="description" content="A gentle, customizable daily planning space that stays on your device."><title>Daywell — your day, with intention</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#f6f4ef;--paper:#fffefa;--ink:#202c29;--muted:#78817a;--line:#e8e6df;--green:#285b49;--soft:#e9f0e9;--lime:#d9e9b9;--peach:#f7e3d6;--shadow:0 14px 44px #26382c0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:24px 32px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;gap:11px;align-items:center;font:800 21px Manrope,sans-serif;letter-spacing:-.7px}.brandmark{width:38px;height:38px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:19px}.top-actions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:999px;font-size:13px}.pill:hover,.secondary:hover{border-color:#b5c4b5}.layout{display:grid;grid-template-columns:220px 1fr;gap:28px}.sidebar{position:sticky;top:20px;height:max-content}.hello{padding:15px 14px;margin-bottom:15px;color:var(--muted);font-size:13px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:transparent;padding:13px 15px;border-radius:13px;color:#69726c;font-weight:600;font-size:14px}.nav button.active{background:var(--soft);color:var(--green)}.nav .ico{width:20px;text-align:center;font-size:17px}.side-note{margin:28px 12px 0;padding:15px;border-radius:15px;background:#eeece5;color:#69726c;font-size:12px;line-height:1.6}.content{min-width:0}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-weight:700;font-size:10px;color:var(--green)}h1,h2,h3,p{margin-top:0}h1{font:700 clamp(28px,4vw,40px) Manrope,sans-serif;letter-spacing:-1.5px;margin:8px 0 8px}h2{font:700 23px Manrope,sans-serif;letter-spacing:-.7px;margin-bottom:6px}h3{font:700 16px Manrope,sans-serif;margin-bottom:5px}.sub{color:var(--muted);font-size:14px;line-height:1.6}.headrow{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.grid{display:grid;gap:15px}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.hero{background:var(--green);color:white;border-radius:22px;padding:27px 30px;display:flex;justify-content:space-between;align-items:center;min-height:176px;margin-bottom:16px;overflow:hidden;position:relative}.hero:after{content:'✳';position:absolute;font-size:200px;line-height:1;color:#ffffff0c;right:50px;top:-24px}.hero .eyebrow{color:#c4d5c8}.hero h2{font-size:27px;margin:8px 0}.hero p{color:#d5e1d8;font-size:14px;margin:0}.hero .btn{z-index:1;background:var(--lime);color:var(--ink)}.hero-copy{z-index:1}.btn{background:var(--green);border:1px solid var(--green);color:white;padding:12px 17px;border-radius:12px;font-weight:700;font-size:13px}.btn:hover{filter:brightness(1.08)}.secondary{background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:11px 15px;border-radius:11px;font-weight:600;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{font:700 28px Manrope,sans-serif;margin:12px 0 3px}.tiny{font-size:12px;color:var(--muted)}.tag{font-size:11px;border-radius:999px;background:var(--soft);color:var(--green);padding:6px 9px;font-weight:700}.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input[type=checkbox]{accent-color:var(--green);width:17px;height:17px}.task label{font-size:14px;flex:1}.task.done label{text-decoration:line-through;color:#98a098}.section-title{margin:25px 0 12px}.checkin{background:#f3f1eb;border-radius:14px;padding:16px;margin-top:14px;font-size:13px;color:#626c65;line-height:1.65}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fffefa;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:#86a18b}.field textarea{min-height:88px;resize:vertical}.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.option{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px}.option input{accent-color:var(--green)}.inline{display:flex;gap:8px}.inline input{flex:1}.mutedbox{background:#f2f0e9;padding:16px;border-radius:14px;color:#687169;font-size:13px;line-height:1.7}.quote{font:500 18px Manrope,sans-serif;line-height:1.6}.historyitem{border-top:1px solid var(--line);padding:15px 0}.historyitem:first-child{border:0}.hidden{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263c32;color:white;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:10}.welcome{max-width:760px;margin:8vh auto;padding:20px}.welcome .card{padding:clamp(25px,6vw,55px)}.welcome h1{font-size:clamp(34px,7vw,56px);max-width:620px}.steps{display:flex;gap:7px;margin:22px 0}.stepdot{height:4px;flex:1;background:var(--line);border-radius:4px}.stepdot.on{background:var(--green)}.wizard-actions{display:flex;justify-content:space-between;margin-top:25px}.sleepfaces{display:flex;gap:8px}.sleepfaces button{border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px;font-size:20px}.sleepfaces button.sel{border-color:var(--green);background:var(--soft)}.notice{font-size:12px;color:var(--muted);line-height:1.6}.schedule-row,.detail-example{background:#f2f0e9;border:1px solid var(--line);border-radius:15px;padding:17px}.schedule-row{margin-bottom:14px}.schedule-card{box-shadow:none}.detail-example p{margin:8px 0 0}.mobilemenu{display:none}
@media(max-width:760px){.shell{padding:17px 17px 35px}.layout{display:block}.sidebar{position:static;margin-bottom:18px}.hello,.side-note{display:none}.nav{display:flex;overflow:auto;gap:6px;padding-bottom:3px}.nav button{white-space:nowrap;padding:10px 12px;font-size:12px}.nav .ico{width:auto}.hero{padding:22px;min-height:190px;align-items:flex-start;flex-direction:column;gap:17px}.hero:after{right:-6px}.headrow{align-items:flex-start;flex-direction:column;gap:10px}.cols3{grid-template-columns:1fr 1fr}.cols2{grid-template-columns:1fr}.card{padding:18px;border-radius:17px}.topbar{margin-bottom:21px}.top-actions .pill{padding:9px 10px;font-size:12px}.option-grid{grid-template-columns:1fr}.welcome{margin:3vh auto;padding:10px}.sleepfaces{flex-wrap:wrap}}
</style>

.nav button{color:var(--muted)}.nav button.active{background:var(--soft);color:var(--accent)}

</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>(()=>{'use strict';
const KEY='daywell.v1';
const defaults=[
  {name:'Learning & study',icon:'📚',enabled:true,items:['Review a lesson','Move one assignment forward']},
  {name:'Work & projects',icon:'🧩',enabled:true,items:['Make progress on one priority']},
  {name:'Movement & fitness',icon:'🌿',enabled:true,items:['Move in a way that feels good']},
  {name:'Family, friends & home',icon:'🏡',enabled:true,items:['Make time for a person or home task']},
  {name:'Hobbies & personal time',icon:'🎨',enabled:true,items:['Make room for something enjoyable']},
  {name:'Wellbeing',icon:'☁️',enabled:true,items:['Pause and check in with myself']},
  {name:'Spiritual or religious practice',icon:'✨',enabled:false,items:['My chosen practice']}
];
let data=load(),view='home',wiz=0,toastTimer;
function fresh(){return {setup:false,name:'friend',appName:'Daywell',wake:'07:00',bed:'22:30',tone:'Gentle and encouraging',chatGptText:false,scheduleBlocks:[{name:'',weekdays:'',weekends:''}],scheduleNote:'',sections:structuredClone(defaults),customQs:[],days:{},sleep:{}}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x)return null;let base=fresh();Object.assign(base,x);if(typeof base.chatGptText!=='boolean')base.chatGptText=false;base.scheduleBlocks ||= [{name:'',weekdays:'',weekends:''}];if(!base.scheduleBlocks.length)base.scheduleBlocks=[{name:'',weekdays:'',weekends:''}];base.sections ||= structuredClone(defaults);base.sections=base.sections.map((s,i)=>({...s,items:Array.isArray(s.items)?s.items:[],details:s.details||{}}));base.customQs ||= [];base.days ||= {};base.sleep ||= {};return base}catch{return null}}
if(!data)data=fresh();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function day(){let k=today();return data.days[k]||(data.days[k]={tasks:{},morning:{},evening:{},note:''})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(s=today()){return new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function notify(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),2300)}
function setView(v){view=v;render()}
function render(){if(!data.setup){renderWizard();return}document.getElementById('app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><span class="brandmark">✳</span>${esc(data.appName||'Daywell')}</div><div class="top-actions"><span class="pill">☀️ ${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span><button class="pill" onclick="setView('settings')">⚙ Settings</button></div></header><div class="layout"><aside class="sidebar"><div class="hello">A little space for your day, ${esc(data.name)}.</div><nav class="nav">${[['home','⌂','Today'],['morning','☀','Morning'],['evening','☾','Evening'],['history','◷','History'],['settings','⚙','Settings']].map(([v,i,n])=>`<button class="${view===v?'active':''}" onclick="setView('${v}')"><span class="ico">${i}</span>${n}</button>`).join('')}</nav><div class="side-note">Your entries stay in this browser on this device. Export a backup to carry them elsewhere.</div></aside><main class="content">${({home:homePage,morning:morningPage,evening:eveningPage,history:historyPage,settings:settingsPage}[view]||homePage)()}</main></div></div>`}
function allTasks(){return data.sections.filter(s=>s.enabled).flatMap((s,si)=>s.items.map((x,i)=>({id:`${si}-${i}`,label:x,group:s.name})))}
function homePage(){let d=day(),tasks=allTasks(),done=tasks.filter(t=>d.tasks[t.id]).length,sl=data.sleep[today()];return `<div class="headrow"><div><div class="eyebrow">${dateLabel()}</div><h1>Your day, with intention.</h1><div class="sub">A steady day is built from small, kind choices.</div></div><span class="tag">${done} of ${tasks.length} intentions checked</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">A fresh start, at your pace</div><h2>What matters today?</h2><p>Choose a few things that feel right. Plans can change.</p></div><button class="btn" onclick="setView('morning')">Open morning plan →</button></section>${data.scheduleBlocks.length?`<div class="section-title"><h2>Your usual rhythm</h2></div><div class="grid cols2">${data.scheduleBlocks.map(b=>`<div class="card schedule-card"><div class="row"><h3>${esc(b.name||'Plan')}</h3><span>◷</span></div><p class="tiny"><b>Weekdays</b> · ${esc(b.weekdays||'Flexible')}</p><p class="tiny"><b>Weekend</b> · ${esc(b.weekends||'Flexible')}</p></div>`).join('')}</div>`:''}<div class="grid cols3" style="margin-top:16px"><div class="card"><div class="row"><span class="tiny">Morning plan</span><span>☀️</span></div><div class="stat">${d.morning.saved?'Ready':'A fresh page'}</div><button class="secondary" onclick="setView('morning')">${d.morning.saved?'Review plan':'Start planning'}</button></div><div class="card"><div class="row"><span class="tiny">Sleep last night</span><span>🌙</span></div><div class="stat">${sl?esc(sl.hours)+' hrs':'—'}</div><button class="secondary" onclick="setView('evening')">${sl?'Logged':'Add sleep log'}</button></div><div class="card"><div class="row"><span class="tiny">Evening reflection</span><span>✍️</span></div><div class="stat">${d.evening.saved?'Done':'When ready'}</div><button class="secondary" onclick="setView('evening')">Open debrief</button></div></div><div class="section-title"><h2>Today’s intentions</h2><div class="sub">Your selected areas, in your own words.</div></div><div class="card">${tasks.length?tasks.map(t=>`<div class="task ${d.tasks[t.id]?'done':''}"><input type="checkbox" ${d.tasks[t.id]?'checked':''} onchange="toggleTask('${esc(t.id)}',this.checked)"><label>${esc(t.label)}</label><span class="tiny">${esc(t.group)}</span></div>`).join(''):'<div class="mutedbox">Turn on a section in Settings to add intentions here.</div>'}</div><div class="checkin">💚 You do not have to complete everything for today to count. A plan is here to support you, not judge you.</div>`}
function toggleTask(id,v){day().tasks[id]=v;save();render()}
function morningPage(){let d=day();return `<div class="headrow"><div><div class="eyebrow">☀ Morning plan · ${dateLabel()}</div><h1>Begin with what matters.</h1><div class="sub">Set a direction, then leave room for real life.</div></div></div><div class="grid cols2"><section class="card"><h3>Today's focus</h3><div class="field"><label>What are the 1–3 things you most want to make space for?</label><textarea id="focus" placeholder="One thing at a time is enough…">${esc(d.morning.focus||'')}</textarea></div><div class="field"><label>How do you want to feel as you move through today?</label><input id="feeling" value="${esc(d.morning.feeling||'')}" placeholder="e.g. steady, curious, present"></div><div class="field"><label>Anything that may need extra care?</label><textarea id="care" placeholder="A meeting, an errand, a boundary…">${esc(d.morning.care||'')}</textarea></div><button class="btn" onclick="saveMorning()">Save morning plan</button></section><section class="card"><h3>Your chosen intentions</h3><p class="sub">Tick these off on the Today page as you go.</p>${allTasks().map(t=>`<div class="task"><span>○</span><label>${esc(t.label)}</label></div>`).join('')||'<div class="mutedbox">Choose sections in Settings to personalise this list.</div>'}<div class="checkin">Start gently. One useful next step is plenty.</div></section></div>`}
function saveMorning(){day().morning={focus:document.getElementById('focus').value,feeling:document.getElementById('feeling').value,care:document.getElementById('care').value,saved:true};save();notify('Morning plan saved.');render()}
function sectionPromptField(s,i,d){let choices=(s.details.choices||'').split('\n').map(x=>x.trim()).filter(Boolean),answer=d.evening.answers?.[s.name]||'';return `<div class="field"><label>${esc(s.details.question)}</label>${choices.length?`<select id="section-answer-${i}"><option value="">Choose an answer (optional)</option>${choices.map(x=>`<option value="${esc(x)}" ${answer===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<textarea id="section-answer-${i}" placeholder="Your answer, if you want to write one…">${esc(answer)}</textarea>`}</div>`}function eveningPage(){let d=day(),sl=data.sleep[today()]||{},prompts=data.sections.filter(s=>s.enabled&&s.details?.question);return `<div class="headrow"><div><div class="eyebrow">☾ Evening debrief · ${dateLabel()}</div><h1>Close the day with care.</h1><div class="sub">Notice what happened. You don’t need to fix it all tonight.</div></div></div><div class="grid cols2"><section class="card"><h3>A short reflection</h3><div class="field"><label>What went well, even in a small way?</label><textarea id="good" placeholder="A moment, an effort, a choice…">${esc(d.evening.good||'')}</textarea></div><div class="field"><label>What felt hard or unfinished?</label><textarea id="hard" placeholder="Name it without judging yourself…">${esc(d.evening.hard||'')}</textarea></div><div class="field"><label>What would help you tomorrow?</label><textarea id="tomorrow" placeholder="One small support or next step…">${esc(d.evening.tomorrow||'')}</textarea></div>${prompts.map((s,i)=>sectionPromptField(s,i,d)).join('')}${(data.customQs||[]).map((q,i)=>`<div class="field"><label>${esc(q)}</label><textarea id="custom-answer-${i}" placeholder="Your answer, if you want to write one…">${esc(d.evening.customAnswers?.[i]||'')}</textarea></div>`).join('')}<button class="btn" onclick="saveEvening()">Save reflection</button></section><section class="card"><h3>Sleep log</h3><p class="sub">A simple record, without scores or targets.</p><div class="field"><label>About how many hours did you sleep last night?</label><input type="number" id="hours" min="0" max="24" step="0.5" value="${esc(sl.hours||'')}" placeholder="e.g. 7.5"></div><div class="field"><label>How did rest feel?</label><div class="sleepfaces">${[['😴','Restful'],['🙂','Okay'],['😐','So-so'],['😵','Tough']].map(([e,t])=>`<button class="${sl.feel===t?'sel':''}" onclick="chooseSleep('${t}',this)" aria-label="${t}">${e}</button>`).join('')}</div><div class="tiny" id="sleepFeel">${esc(sl.feel||'Choose what fits')}</div></div><div class="field"><label>Optional note</label><input id="sleepnote" value="${esc(sl.note||'')}" placeholder="Anything you want to remember"></div><button class="secondary" onclick="saveSleep()">Save sleep log</button><div class="checkin">Sleep notes are personal observations, not a health assessment.</div></section></div>`}
function chooseSleep(x,b){document.querySelectorAll('.sleepfaces button').forEach(a=>a.classList.remove('sel'));b.classList.add('sel');document.getElementById('sleepFeel').textContent=x;window._sleepFeel=x}
function saveSleep(){data.sleep[today()]={hours:document.getElementById('hours').value,feel:window._sleepFeel||data.sleep[today()]?.feel||'',note:document.getElementById('sleepnote').value};save();notify('Sleep log saved.');render()}
function saveEvening(){let answers={},customAnswers={};data.sections.filter(s=>s.enabled&&s.details?.question).forEach((s,i)=>answers[s.name]=document.getElementById(`section-answer-${i}`)?.value||'');(data.customQs||[]).forEach((_,i)=>customAnswers[i]=document.getElementById(`custom-answer-${i}`)?.value||'');day().evening={good:document.getElementById('good').value,hard:document.getElementById('hard').value,tomorrow:document.getElementById('tomorrow').value,answers,customAnswers,saved:true};save();notify('Reflection saved.');render()}
function historyPage(){let entries=Object.entries(data.days).sort(([a],[b])=>b.localeCompare(a));return `<div class="headrow"><div><div class="eyebrow">Your private timeline</div><h1>Look back kindly.</h1><div class="sub">Past entries saved in this browser.</div></div><button class="secondary" onclick="exportReport()">Copy a report</button></div><div class="card">${entries.length?entries.map(([date,d])=>`<div class="historyitem"><div class="row"><h3>${esc(dateLabel(date))}</h3><span class="tag">${Object.values(d.tasks||{}).filter(Boolean).length} done</span></div>${d.morning?.focus?`<p class="tiny"><b>Focus:</b> ${esc(d.morning.focus)}</p>`:''}${d.evening?.good?`<p class="tiny"><b>Went well:</b> ${esc(d.evening.good)}</p>`:''}${d.evening?.hard?`<p class="tiny"><b>Hard:</b> ${esc(d.evening.hard)}</p>`:''}${data.sleep[date]?`<p class="tiny">Sleep: ${esc(data.sleep[date].hours)} hours · ${esc(data.sleep[date].feel)}</p>`:''}</div>`).join(''):'<div class="mutedbox">Your saved days will appear here. Start with today; there is no streak to maintain.</div>'}</div><div class="checkin">Reports are generated in your browser. You choose whether to copy any text elsewhere.</div>`}
function settingsPage(){return `<div class="headrow"><div><div class="eyebrow">Make this space yours</div><h1>Settings & sections</h1><div class="sub">Change what appears in your daily plan.</div></div><button class="secondary" onclick="editSetup()">Edit setup pages</button></div><section class="card"><h2>Your sections</h2><p class="sub">Turn areas on or off, rename them, or edit their daily intentions.</p>${data.sections.map((s,i)=>`<div class="historyitem"><div class="row"><label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" ${s.enabled?'checked':''} onchange="sectionEnable(${i},this.checked)" style="accent-color:var(--green)">${esc(s.icon)} <input value="${esc(s.name)}" onchange="sectionName(${i},this.value)" style="border:0;background:transparent;font:700 15px Manrope;width:190px;color:var(--ink)"></label><button class="secondary" onclick="removeSection(${i})">Remove</button></div><div class="field"><label>Intentions (one per line)</label><textarea onchange="sectionItems(${i},this.value)">${esc(s.items.join('\n'))}</textarea></div></div>`).join('')}<div class="inline"><input id="newsection" class="field" style="margin:0" placeholder="Add a section, e.g. Creative practice"><button class="btn" onclick="addSection()">Add section</button></div><div class="section-title"><h3>Custom reflection questions</h3><p class="sub">Keep prompts that matter to you.</p>${(data.customQs||[]).map((q,i)=>`<div class="row"><span class="tiny">${esc(q)}</span><button class="secondary" onclick="removeQuestion(${i})">Remove</button></div>`).join('')}<div class="inline"><input id="newq" placeholder="Write a question"><button class="secondary" onclick="addQuestion()">Add question</button></div></div></section><div class="section-title"><h2>Your data</h2></div><div class="grid cols2"><section class="card"><h3>Device storage</h3><p class="sub">Your entries live in this browser on this device. They are not synced, uploaded, or sent to an AI service. Clearing browser data may remove them.</p><button class="secondary" onclick="exportBackup()">Download backup</button> <label class="secondary" style="display:inline-block;cursor:pointer">Restore backup<input type="file" accept="application/json,.json" onchange="importBackup(event)" hidden></label></section><section class="card"><h3>Use with ChatGPT, if you choose</h3><p class="sub">There is no automatic ChatGPT connection. Create a local report, then decide yourself whether to copy and share it.</p><button class="secondary" onclick="exportReport()">Copy my report</button></section></div><div class="section-title"><button class="secondary" onclick="resetData()">Start over and erase local data</button></div>`}
function sectionEnable(i,v){data.sections[i].enabled=v;save();render()}
function sectionName(i,v){data.sections[i].name=v;save()}
function sectionItems(i,v){data.sections[i].items=v.split('\n').map(x=>x.trim()).filter(Boolean);save()}
function addSection(){let x=document.getElementById('newsection').value.trim();if(!x)return;data.sections.push({name:x,icon:'✳',enabled:true,items:['Add an intention that fits'],details:{}});save();render()}
function removeSection(i){if(confirm('Remove this section?')){data.sections.splice(i,1);save();render()}}
function addQuestion(){let x=document.getElementById('newq').value.trim();if(x){data.customQs.push(x);save();render()}}
function removeQuestion(i){data.customQs.splice(i,1);save();render()}
function reportText(){let d=day();return `${data.appName} · ${dateLabel()}\n\nMorning focus: ${d.morning.focus||'—'}\nHow I want to feel: ${d.morning.feeling||'—'}\nIntentions completed: ${allTasks().filter(t=>d.tasks[t.id]).map(t=>t.label).join(', ')||'—'}\n\nWent well: ${d.evening.good||'—'}\nFelt hard: ${d.evening.hard||'—'}\nFor tomorrow: ${d.evening.tomorrow||'—'}\nSleep: ${data.sleep[today()]?.hours||'—'} hours, ${data.sleep[today()]?.feel||'—'}\n\nThis report was created locally. I chose to share it.`}
function exportReport(){let s=reportText();if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>notify('Report copied. Share it only if you choose.')).catch(()=>prompt('Copy your report:',s));else prompt('Copy your report:',s)}
function download(name,txt){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){download('daywell-backup-'+today()+'.json',JSON.stringify(data,null,2));notify('Backup downloaded.')}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.sections)||!x.days)throw 0;data={...fresh(),...x};data.sections=data.sections.map(s=>({...s,details:s.details||{},items:Array.isArray(s.items)?s.items:[]}));data.scheduleBlocks||=[];save();render();notify('Backup restored.')}catch{notify('That file does not look like a Daywell backup.')}};r.readAsText(f)}
function resetData(){if(confirm('Erase this planner and all entries saved in this browser? Download a backup first if you want to keep them.')){localStorage.removeItem(KEY);data=fresh();render()}}
function editSetup(){data.setup=false;wiz=0;render()}
function activeSections(){return data.sections.filter(s=>s.enabled)}
function plannerText(){let lines=[`${data.appName||'Personal planner'} — setup summary`,`Prepared for: ${data.name||'Not specified'}`,`Planning voice: ${data.tone||'Gentle and encouraging'}`,'','DAILY RHYTHM'];let plans=data.scheduleBlocks.filter(b=>b.name||b.weekdays||b.weekends);if(plans.length)plans.forEach(b=>{lines.push(`• ${b.name||'Plan'}`,`  Weekdays: ${b.weekdays||'Flexible'}`,`  Weekend: ${b.weekends||'Flexible'}`)});else lines.push('• No fixed schedule added; keep the day flexible.');if(data.scheduleNote)lines.push(`Schedule note: ${data.scheduleNote}`);lines.push('','MY CHOSEN SECTIONS');let sections=activeSections();if(sections.length)sections.forEach(s=>{let d=s.details||{};lines.push('',`${s.icon||'•'} ${s.name}`);if(d.activities)lines.push(`Details: ${d.activities}`);if(d.weekdays)lines.push(`Weekdays: ${d.weekdays}`);if(d.weekends)lines.push(`Weekend: ${d.weekends}`);if(s.items?.length)lines.push('Intentions:',...s.items.map(x=>`• ${x}`));if(d.question)lines.push(`Reflection question: ${d.question}`);if(d.choices)lines.push(`Answer choices: ${d.choices.split('\n').map(x=>x.trim()).filter(Boolean).join(' / ')}`)});else lines.push('• No sections selected yet.');if(data.customQs?.length){lines.push('','ADDITIONAL REFLECTION QUESTIONS',...data.customQs.map(q=>`• ${q}`))}return lines.join('\n')}
function chatGptPrompt(){return `I made the planner below using ${data.appName||'Personal Dharma OS'}, a customizable personal planning web app. This is a user-created export of the schedule, sections, intentions, and preferences I entered; the app does not send data to ChatGPT automatically.\n\nPlease help me understand and elaborate this planner into a realistic, flexible plan I can use. First explain how you interpret the information and how the sections fit together. Then suggest a practical daily rhythm with a morning plan and evening reflection, using only the details I provided. Respect the weekday and weekend timings, keep the plan gentle and achievable, and point out any timing conflicts or missing details instead of guessing. Do not add responsibilities, religious practices, health advice, or priorities I did not choose. If something important is unclear, ask me a short question.\n\nHere is my planner:\n\n${plannerText()}`}
function copyText(text,done){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify(done)).catch(()=>prompt('Copy this text:',text))}else prompt('Copy this text:',text)}
function copyPlanner(){copyText(plannerText(),'Planner copied. Paste it wherever you want.')}
function copyChatGPT(){copyText(chatGptPrompt(),'ChatGPT prompt copied. Open a new chat and paste it there.')}
function setChatGptText(value){data.chatGptText=value;save();renderWizard()}
function plannerPreviewMarkup(){let plans=data.scheduleBlocks.filter(b=>b.name||b.weekdays||b.weekends),sections=activeSections();return `<div class="report-header"><span class="report-badge">YOUR ROUTINE · YOUR CHOICES</span><h2>🪔 ${esc(data.appName||'Personal planner')}</h2><p>Prepared for ${esc(data.name||'you')} · ${esc(data.tone||'Gentle and encouraging')}</p></div><div class="planner-panel"><h3>Daily rhythm</h3>${plans.length?plans.map(b=>`<div class="planner-section"><b>${esc(b.name||'Plan')}</b><p>Weekdays: ${esc(b.weekdays||'Flexible')}<br>Weekend: ${esc(b.weekends||'Flexible')}</p></div>`).join(''):'<p class="sub">No fixed schedule added; keep the day flexible.</p>'}${data.scheduleNote?`<p><b>Note:</b> ${esc(data.scheduleNote)}</p>`:''}</div><div class="planner-panel"><h3>Chosen sections</h3>${sections.length?sections.map(s=>{let d=s.details||{};return `<div class="planner-section"><b>${esc(s.icon||'•')} ${esc(s.name)}</b>${d.activities?`<p><b>Details:</b><br>${esc(d.activities).replace(/\n/g,'<br>')}</p>`:''}${d.weekdays?`<p><b>Weekdays:</b><br>${esc(d.weekdays).replace(/\n/g,'<br>')}</p>`:''}${d.weekends?`<p><b>Weekend:</b><br>${esc(d.weekends).replace(/\n/g,'<br>')}</p>`:''}<p><b>Intentions:</b><br>${s.items?.length?s.items.map(esc).join('<br>'):'Not added yet'}</p>${d.question?`<p><b>Reflection question:</b> ${esc(d.question)}</p>`:''}${d.choices?`<p><b>Answer choices:</b><br>${esc(d.choices).replace(/\n/g,'<br>')}</p>`:''}</div>`}).join(''):'<p class="sub">No sections selected yet. You can add them in Settings.</p>'}${data.customQs?.length?`<div class="planner-section"><b>Extra reflection questions</b><p>${data.customQs.map(esc).join('<br>')}</p></div>`:''}</div><div class="planner-panel"><h3>Your planner text</h3><p class="sub">Copy this summary to keep or share. Nothing is sent automatically.</p><div class="planner-output">${esc(plannerText())}</div><div class="planner-actions"><button class="secondary" onclick="copyPlanner()">Copy planner</button>${data.chatGptText?'<button class="btn" onclick="copyChatGPT()">Copy for ChatGPT</button>':''}</div>${data.chatGptText?'<div class="checkin">Open a new ChatGPT chat, then paste the copied message. It includes an explanation of this planner and your setup so ChatGPT can respond with the right context.</div>':''}</div>`}
const detailPrompts={
 'Learning & study':['What classes, courses, or tutoring do you have?','What is your usual weekday schedule?','What is your usual weekend schedule?','What study intentions should appear each day?'],
 'Work & projects':['What work, projects, or responsibilities are you focusing on?','What are your usual weekday hours?','Do your weekend plans differ?','What small work intentions help you make progress?'],
 'Movement & fitness':['What kinds of movement do you enjoy?','When do you usually make time on weekdays?','What works on weekends?','What movement intentions would you like to track?'],
 'Family, friends & home':['What home or family responsibilities matter to you?','Which ones happen on weekdays, and when?','What tends to happen on weekends?','Who or what would you like to make time for?'],
 'Hobbies & personal time':['What hobbies or personal projects would you like to make room for?','When might you enjoy them on weekdays?','When might you enjoy them on weekends?','What small intentions would help you enjoy this time?'],
 'Wellbeing':['What helps you feel grounded or cared for?','What could fit into a weekday?','What could fit into a weekend?','What gentle wellbeing intentions would you like to see?'],
 'Spiritual or religious practice':['Which practices would you like to include?','When do you usually make time for them on weekdays?','What about weekends?','Which practices should appear as daily intentions?']
};
function promptsFor(s){return detailPrompts[s.name]||[`What belongs in ${s.name}?`,`When does this usually happen on weekdays?`,`What does it look like on weekends?`,`What small intentions should appear in this section?`]}
function captureSchedule(keepBlank=false){document.querySelectorAll('.schedule-row').forEach(el=>{let i=Number(el.dataset.index);data.scheduleBlocks[i]={name:el.querySelector('.schedule-name').value,weekdays:el.querySelector('.schedule-weekdays').value,weekends:el.querySelector('.schedule-weekends').value}});if(!keepBlank)data.scheduleBlocks=data.scheduleBlocks.filter(b=>b.name||b.weekdays||b.weekends)}
function scheduleAdd(){captureSchedule(true);data.scheduleBlocks.push({name:'',weekdays:'',weekends:''});renderWizard()}
function scheduleRemove(i){captureSchedule(true);data.scheduleBlocks.splice(i,1);if(!data.scheduleBlocks.length)data.scheduleBlocks=[{name:'',weekdays:'',weekends:''}];renderWizard()}function saveSectionDetail(s){let i=activeSections().indexOf(s);s.details={...(s.details||{}),activities:document.getElementById(`activities-${i}`).value,weekdays:document.getElementById(`weekdays-${i}`).value,weekends:document.getElementById(`weekends-${i}`).value,question:document.getElementById(`question-${i}`).value,choices:document.getElementById(`choices-${i}`).value};s.items=document.getElementById(`intentions-${i}`).value.split('\n').map(x=>x.trim()).filter(Boolean)}
function renderWizard(){let sections=activeSections(),scheduleRows=data.scheduleBlocks.length?data.scheduleBlocks:[{name:'',weekdays:'',weekends:''}],finalStep=3+sections.length,total=finalStep+1,sectionIndex=wiz-3,isDetail=wiz>=3&&wiz<finalStep,body='',title='';if(wiz===0){title='A space that fits you';body=`<p class="sub">A personal planning space for the routines, people, projects, and practices that matter in your life.</p><div class="field"><label>What should we call you?</label><input id="name" value="${esc(data.name==='friend'?'':data.name)}" placeholder="Your name or nickname"></div><div class="field"><label>What would you like to call this app?</label><input id="appname" value="${esc(data.appName)}" placeholder="Daywell"></div><div class="field"><label>What kind of voice feels right?</label><select id="tone">${['Gentle and encouraging','Friendly and casual','Clear and focused','Calm and reflective'].map(x=>`<option ${data.tone===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Should it also generate a text prompt for ChatGPT?</label><div class="option-grid"><label class="option"><input type="radio" name="chatgpt" value="yes" ${data.chatGptText?'checked':''} onchange="setChatGptText(true)">Yes, create one</label><label class="option"><input type="radio" name="chatgpt" value="no" ${!data.chatGptText?'checked':''} onchange="setChatGptText(false)">No, thanks</label></div><p class="notice">This is optional. If you choose yes, the last setup page will make a message you can copy into a new ChatGPT chat. Nothing is sent automatically.</p></div>`}
else if(wiz===1){title='Shape your daily rhythm';body=`<p class="sub">Add the plans that give your day a rhythm. Weekdays and weekends can look different.</p><div class="grid">${scheduleRows.map((b,i)=>`<div class="schedule-row" data-index="${i}"><div class="row"><h3>Regular plan ${i+1}</h3>${data.scheduleBlocks.length>1?`<button class="secondary" type="button" onclick="scheduleRemove(${i})">Remove</button>`:''}</div><div class="field"><label>What is this plan?</label><input class="schedule-name" value="${esc(b.name)}" placeholder="e.g. Class, shift, coaching, family time"></div><div class="grid cols2"><div class="field"><label>Weekdays</label><input class="schedule-weekdays" value="${esc(b.weekdays)}" placeholder="e.g. Mon–Fri, 8:30 am–2:45 pm"></div><div class="field"><label>Weekend</label><input class="schedule-weekends" value="${esc(b.weekends)}" placeholder="e.g. Saturday, 10:00 am–12:00 pm or none"></div></div></div>`).join('')}</div><button class="secondary" type="button" onclick="scheduleAdd()">+ Add another plan</button><div class="field"><label>Anything else to keep in mind?</label><textarea id="scheduleNote" placeholder="Some days change, so keep this flexible…">${esc(data.scheduleNote||'')}</textarea></div><div class="mutedbox">These are your own reference times. The planner does not send reminders.</div>`}
else if(wiz===2){title='Choose your main sections';body=`<p class="sub">Pick the areas you want to include. Next, you’ll set up each selected area on its own page.</p><div class="option-grid">${data.sections.map((s,i)=>`<label class="option"><input type="checkbox" ${s.enabled?'checked':''} onchange="sectionToggleDraft(${i},this.checked)">${esc(s.icon)} ${esc(s.name)}${s.name.toLowerCase().includes('spiritual')?' <span class="tiny">(optional)</span>':''}</label>`).join('')}</div><div class="field"><label>Add your own main section</label><div class="inline"><input id="setupsection" placeholder="e.g. Community, caregiving, music"><button class="secondary" onclick="setupAddSection()">Add</button></div></div><div class="mutedbox">Choose only what fits your life. You can add, remove, or change sections later.</div>`}
else if(isDetail){let s=sections[sectionIndex],p=promptsFor(s),d=s.details||{};title=`Set up ${s.name}`;body=`<p class="sub">Add the details and options you want for this area. Leave anything blank if it doesn’t apply.</p><div class="detail-example"><b>${esc(s.icon)} ${esc(s.name)}</b><p class="tiny">This page is just for this section. You can personalize every prompt and intention.</p></div><div class="field"><label>${esc(p[0])}</label><textarea id="activities-${sectionIndex}" placeholder="Add your own details…">${esc(d.activities||'')}</textarea></div><div class="grid cols2"><div class="field"><label>${esc(p[1])}</label><textarea id="weekdays-${sectionIndex}" placeholder="Add days and times, or write ‘flexible’…">${esc(d.weekdays||'')}</textarea></div><div class="field"><label>${esc(p[2])}</label><textarea id="weekends-${sectionIndex}" placeholder="Add days and times, or write ‘none’…">${esc(d.weekends||'')}</textarea></div></div><div class="field"><label>${esc(p[3])} <span class="tiny">(one per line)</span></label><textarea id="intentions-${sectionIndex}" placeholder="Write a few intentions…">${esc(s.items.join('\n'))}</textarea></div><div class="field"><label>Would you like a personal reflection question for this section?</label><input id="question-${sectionIndex}" value="${esc(d.question||'')}" placeholder="e.g. What did I learn today?"></div><div class="field"><label>Optional answer choices <span class="tiny">(one per line; leave blank for a written answer)</span></label><textarea id="choices-${sectionIndex}" placeholder="e.g. Went well\nWant to practise more\nSomething else">${esc(d.choices||'')}</textarea></div>`}
else{title='Review your personal planner';body=`<p class="sub">Here’s the setup you chose. You can go back and change anything before opening your planner.</p><div class="section-title"><h3>Your daily rhythm</h3></div><div class="grid">${data.scheduleBlocks.filter(b=>b.name||b.weekdays||b.weekends).map(b=>`<div class="detail-example"><b>${esc(b.name||'Plan')}</b><p class="tiny">Weekdays: ${esc(b.weekdays||'Flexible')}<br>Weekend: ${esc(b.weekends||'Flexible')}</p></div>`).join('')||'<div class="mutedbox">No regular schedule added. Your day can stay flexible.</div>'}</div><div class="section-title"><h3>Your chosen sections</h3></div><div class="grid cols2">${sections.map(s=>`<div class="detail-example"><b>${esc(s.icon)} ${esc(s.name)}</b><p class="tiny">${s.items.length?esc(s.items.join(' · ')):'No daily intentions added yet'}</p></div>`).join('')||'<div class="mutedbox">No sections selected yet. You can add them from Settings.</div>'}</div><div class="checkin">Your entries stay in this browser on this device. You can export a backup in Settings.</div>`}
if(wiz===finalStep){title='Your planner is ready';body=`<p class="sub">Here’s the finished planner from your setup. Review it, copy it, or open your daily planner.</p>${plannerPreviewMarkup()}`}
document.getElementById('app').innerHTML=`<div class="welcome"><div class="brand" style="margin-bottom:24px"><span class="brandmark">✳</span>${esc(data.appName||'Daywell')}</div><div class="card"><div class="eyebrow">Personal setup · ${Math.min(wiz+1,total)} of ${total}</div><div class="steps">${Array.from({length:total},(_,i)=>`<div class="stepdot ${i<=wiz?'on':''}"></div>`).join('')}</div><h1>${title}</h1>${body}<div class="wizard-actions">${wiz>0?'<button class="secondary" onclick="wizardBack()">← Back</button>':'<span></span>'}<button class="btn" onclick="wizardNext()">${wiz===finalStep?'Open my planner':'Continue →'}</button></div></div><p class="notice" style="text-align:center;margin-top:15px">Free to shape around your life. No streaks, scores, or pressure.</p></div>`}
function sectionToggleDraft(i,v){data.sections[i].enabled=v;save()}
function setupAddSection(){let e=document.getElementById('setupsection'),x=e.value.trim();if(x){data.sections.push({name:x,icon:'✳',enabled:true,items:[],details:{}});save();renderWizard()}}
function wizardBack(){if(wiz>0){if(wiz>=3&&wiz<3+activeSections().length)saveSectionDetail(activeSections()[wiz-3]);if(wiz===1){captureSchedule();data.scheduleNote=document.getElementById('scheduleNote').value}wiz--;renderWizard()}}
function wizardNext(){let sections=activeSections(),finalStep=3+sections.length;if(wiz===0){data.name=document.getElementById('name').value.trim()||'friend';data.appName=document.getElementById('appname').value.trim()||'Daywell';data.tone=document.getElementById('tone').value}else if(wiz===1){captureSchedule();data.scheduleNote=document.getElementById('scheduleNote').value}else if(wiz>=3&&wiz<finalStep){saveSectionDetail(sections[wiz-3])}else if(wiz===finalStep){data.setup=true;save();view='home';render();return}wiz=Math.min(finalStep,wiz+1);save();renderWizard()}
function selectedTasks(){return allTasks()}
function dateIsWeekend(date=today()){let n=new Date(date+'T12:00:00').getDay();return n===0||n===6}
function day(){let k=today();if(!data.days[k])data.days[k]={tasks:{},morning:{},evening:{},note:'',plannedTasks:selectedTasks().map(t=>({...t}))};let d=data.days[k];d.tasks||={};d.morning||={};d.evening||={};d.plannedTasks||=selectedTasks().map(t=>({...t}));d.taskLabels||={};d.dayPlanner||={};return d}
function render(){if(!data.setup){renderWizard();return}let pages={home:homePage,morning:morningPage,evening:eveningPage,sleep:sleepPage,history:historyPage,monthly:monthlyPage,settings:settingsPage};document.getElementById('app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><span class="brandmark">✳</span>${esc(data.appName||'Daywell')}</div><div class="top-actions"><span class="pill">☀️ ${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span><button class="pill" onclick="setView('settings')">⚙ Settings</button></div></header><div class="layout"><aside class="sidebar"><div class="hello">A little space for your day, ${esc(data.name)}.</div><nav class="nav">${[['home','⌂','Home'],['morning','☀','Day Planner'],['evening','☾','Night Debrief'],['sleep','🌙','Sleep Log'],['history','◷','History'],['monthly','▦','Monthly'],['settings','⚙','Settings']].map(([v,i,n])=>`<button class="${view===v?'active':''}" onclick="setView('${v}')"><span class="ico">${i}</span>${n}</button>`).join('')}</nav><div class="side-note">Your entries stay in this browser on this device. Nothing is sent to ChatGPT automatically.</div></aside><main class="content">${(pages[view]||homePage)()}</main></div></div>`}
function allTasks(){return data.sections.filter(s=>s.enabled).flatMap((s,si)=>s.items.map((x,i)=>({id:`${si}-${i}`,label:x,group:s.name})))}
const motivationLines=['You only need a next step, not a perfect day.','Small progress still counts.','Make room for focus and for rest.','A plan can bend and still help you.','Start where you are; adjust as you go.','Your effort matters even when the day changes.','Choose what matters most, then take it one step at a time.','Rest is part of a steady plan.'];
function motivationForToday(){let d=day();if(d.motivationOverride)return d.motivationOverride;let seed=Math.floor(Date.parse(today()+'T00:00:00Z')/86400000);return motivationLines[((seed%motivationLines.length)+motivationLines.length)%motivationLines.length]}
function newMotivation(){let d=day(),current=motivationForToday(),choices=motivationLines.filter(x=>x!==current);d.motivationOverride=choices[Math.floor(Math.random()*choices.length)];save();render()}
function mainHomePage(){let d=day(),tasks=selectedTasks(),done=tasks.filter(t=>d.tasks[t.id]).length,sl=data.sleep[today()],p=d.dayPlanner||{},generated=!!p.report;return `<div class="headrow"><div><div class="eyebrow">${dateLabel()}</div><h1>Your day, with intention.</h1><div class="sub">A steady day is built from small, kind choices.</div></div><span class="tag">${done} of ${tasks.length} intentions checked</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">A note for today</div><h2>${esc(motivationForToday())}</h2><p>Let it encourage you, not pressure you.</p></div><button class="btn" onclick="newMotivation()">Another message ↻</button></section><div class="grid cols3 home-cards"><div class="card"><div class="row"><span class="tiny">Day planner</span><span>☀️</span></div><div class="stat">${generated?'Generated':'Not generated yet'}</div>${generated?`<p class="tiny">Updated ${esc(new Date(p.generatedAt||Date.now()).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}))}</p>`:'<p class="tiny">Build today’s plan when you’re ready.</p>'}<button class="secondary" onclick="setView('morning')">${generated?'Review planner':'Create day planner'}</button></div><div class="card"><div class="row"><span class="tiny">Sleep log</span><span>🌙</span></div><div class="stat">${sl?.hours?esc(sl.hours)+' hrs':'Not logged yet'}</div><p class="tiny">${sl?.wakeAt?`Wake-up · ${esc(sl.wakeAt)}`:'Your sleep notes stay private.'}</p><button class="secondary" onclick="setView('sleep')">${sl?'Review sleep log':'Add sleep log'}</button></div><div class="card"><div class="row"><span class="tiny">Night debrief</span><span>✍️</span></div><div class="stat">${d.evening.report?'Ready':'Not generated yet'}</div><p class="tiny">Notice what happened and plan a gentle next step.</p><button class="secondary" onclick="setView('evening')">Open debrief</button></div></div>${generated?`<div class="planner-panel"><div class="row"><h2>Today’s planner</h2><button class="secondary" onclick="setView('morning')">View full plan</button></div><div class="planner-output">${esc(p.report)}</div></div>`:`<div class="mutedbox planner-status"><b>Planner isn’t generated yet.</b> Your setup is ready; open Day Planner when you want to shape today’s schedule.</div>`}<div class="section-title"><h2>Today’s intentions</h2><div class="sub">Your chosen sections, in your own words.</div></div><div class="card">${tasks.length?tasks.map(t=>`<div class="task ${d.tasks[t.id]?'done':''}"><input type="checkbox" ${d.tasks[t.id]?'checked':''} onchange="toggleTask('${esc(t.id)}',this.checked)"><label>${esc(t.label)}</label><span class="tiny">${esc(t.group)}</span></div>`).join(''):'<div class="mutedbox">Turn on a section in Settings to add intentions here.</div>'}</div><div class="checkin">💚 You do not have to complete everything for today to count. A plan is here to support you, not judge you.</div><div class="section-title"><button class="secondary" onclick="setView('monthly')">Open monthly debrief →</button></div>`}
function toggleTask(id,v){let d=day(),task=selectedTasks().find(t=>t.id===id);d.tasks[id]=v;if(task)d.taskLabels[id]={label:task.label,group:task.group};save();render()}
function selectedPlanLines(p){let ids=p.regularPlanIds||[];return ids.map(i=>{let b=data.scheduleBlocks[Number(i)];if(!b)return '';let time=p.dayType==='Weekend'?b.weekends:b.weekdays;return `${b.name||'Plan'} — ${time||'time not set'}`}).filter(Boolean)}
function clockSort(v){let m=String(v).match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);if(!m)return 9999;let h=Number(m[1])%12,min=Number(m[2]||0);if((m[3]||'').toLowerCase()==='pm')h+=12;return h*60+min}
function planRows(p){let rows=[],add=(time,activity)=>{if(activity)rows.push({time:time||'Flexible',activity})};add(p.wakeTime,'Wake up and get ready');(p.regularPlanIds||[]).forEach(i=>{let b=data.scheduleBlocks[Number(i)];if(b)add(p.dayType==='Weekend'?b.weekends:b.weekdays,b.name||'Regular plan')});(p.daySchedule||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{let parts=x.split('|');add(parts.length>1?parts.shift().trim():'Flexible',parts.join('|').trim()||x)});add(p.freeTime?`Free from ${p.freeTime}`:'','Open time / transition');if(p.focus)add('Flexible',`Focus: ${p.focus}`);if(p.protected)add('Flexible',`Protected time: ${p.protected}`);if(p.bedTime)add(p.bedTime,'Wind down / bedtime');rows.sort((a,b)=>clockSort(a.time)-clockSort(b.time));return rows.length?rows:[{time:'Add a time',activity:'Your schedule will appear here after you add today’s details.'}]}
function plannerTable(p){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Plan for the day</th></tr></thead><tbody>${planRows(p).map(r=>`<tr><td>${esc(r.time)}</td><td>${esc(r.activity)}</td></tr>`).join('')}</tbody></table></div>`}
function sectionDayFields(p){return data.sections.filter(s=>s.enabled&&(/movement|fitness|sport/i.test(s.name)||/spiritual|religious/i.test(s.name))).map(s=>{let isMove=/movement|fitness|sport/i.test(s.name),key=isMove?'movement':'practice';return `<div class="field"><label>${isMove?'Movement for today':`Anything from ${esc(s.name)} today?`}</label><input data-extra="${key}" value="${esc(p[key]||'')}" placeholder="${esc(s.details?.activities||'Optional — add what fits today')}"></div>`}).join('')}
function planCheckOptions(p){let chosen=p.regularPlanIds||data.scheduleBlocks.map((b,i)=>((p.dayType==='Weekend'?b.weekends:b.weekdays)?String(i):null)).filter(x=>x!==null);return data.scheduleBlocks.map((b,i)=>`<label class="option"><input type="checkbox" name="regularPlan" value="${i}" ${chosen.includes(String(i))||chosen.includes(i)?'checked':''}>${esc(b.name||'Regular plan')} <span class="tiny">${esc(p.dayType==='Weekend'?(b.weekends||'time not set'):(b.weekdays||'time not set'))}</span></label>`).join('')||'<p class="sub">Set up classes, work, or regular plans in the setup pages.</p>'}
function plannerTextValue(p){return [`${data.appName||'Personal planner'} · Day Planner · ${dateLabel()}`,`Day type: ${p.dayType||'Flexible day'}`,`Wake-up: ${p.wakeTime||'—'} · Bedtime: ${p.bedTime||'—'}`,`Main priority: ${p.priority||'—'}`,`Free from: ${p.freeTime||'—'}`,`Regular plans: ${selectedPlanLines(p).join('; ')||'None selected'}`,`Whole-day schedule:\n${planRows(p).map(r=>`${r.time} | ${r.activity}`).join('\n')}`,`Tasks / deadlines: ${p.tasks||'—'}`,`Screen-time note: ${p.screenYesterday||'—'}; intention: ${p.screenGoal||'—'}${p.screenTarget?` (${p.screenTarget})`:''}`,`Energy: ${p.energy||'—'} · Headspace: ${p.headspace||'—'}`,`Movement: ${p.movement||'—'} · Optional practice: ${p.practice||'—'}`,`Protected free time: ${p.protected||'—'}`,`Weekly goal: ${p.weeklyGoal||'—'} · Progress: ${p.weeklyStatus||'—'}`,`Extra context: ${p.context||'—'}`,'\nThis plan is a flexible draft based on the user’s own entries.'].join('\n')}
function mainMorningPage(){let d=day(),p=d.dayPlanner||{},dayType=p.dayType||(dateIsWeekend()?'Weekend':'Weekday'),priorityOptions=data.sections.filter(s=>s.enabled).map(s=>s.name);return `<div class="report-header"><span class="report-badge">DISCIPLINE · DUTY · BALANCE</span><h2>☀️ Day Planner</h2><p>Build a realistic plan from your schedule and priorities. Adjust it whenever the day changes.</p></div><div class="notice">Your entries stay in this browser on this device. This planner creates a draft from your inputs; it does not send reminders or automatically message ChatGPT.</div><section class="card"><h3>1. Wake-up time</h3><div class="field"><input type="time" id="pWake" value="${esc(p.wakeTime||data.wake||'07:00')}"></div><h3>2. Today’s schedule</h3><div class="option-grid">${[['Weekday','Weekday'],['Weekend','Weekend'],['Flexible day','Flexible day'],['Special schedule','Special schedule']].map(([v,l])=>`<label class="option"><input type="radio" name="dayType" value="${v}" ${dayType===v?'checked':''}>${l}</label>`).join('')}</div><div class="field"><label>What’s different today?</label><input id="pDayNote" value="${esc(p.dayNote||'')}" placeholder="Optional — holiday, appointment, event, or other change"></div><h3>3. Your regular classes, work, or plans</h3><p class="sub">These options come from the weekday/weekend schedule you entered during setup.</p><div class="option-grid">${planCheckOptions({...p,dayType})}</div><div class="grid cols2"><div class="field"><label>When will you be home or free?</label><input id="pFree" value="${esc(p.freeTime||'')}" placeholder="e.g. Free from 4:30 pm"></div><div class="field"><label>Target bedtime</label><input type="time" id="pBed" value="${esc(p.bedTime||data.bed||'22:30')}"></div></div><div class="field"><label>Add the rest of your day as a timetable <span class="tiny">(one block per line: time | activity)</span></label><textarea id="pDaySchedule" placeholder="7:00–8:00 am | Morning routine&#10;8:00 am–2:30 pm | Classes or work&#10;4:30–5:00 pm | Break and reset">${esc(p.daySchedule||'')}</textarea></div><h3>4. Today’s main priority</h3><div class="field"><label>Choose one of your sections</label><select id="pPriority"><option value="">Choose a priority</option>${priorityOptions.map(x=>`<option ${p.priority===x?'selected':''}>${esc(x)}</option>`).join('')}<option ${p.priority==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Tasks and deadlines</label><textarea id="pTasks" placeholder="Add anything specific you need to remember…">${esc(p.tasks||'')}</textarea></div><div class="grid cols2"><div class="field"><label>Weekly goal, if you have one</label><input id="pGoal" value="${esc(p.weeklyGoal||'')}" placeholder="Optional — write your own goal"></div><div class="field"><label>How is it going?</label><select id="pGoalStatus"><option value="">Choose (optional)</option>${['On track','Progressing slowly','Fell behind','Adjust goal','No weekly goal'].map(x=>`<option ${p.weeklyStatus===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="section-title"><h3>5. Your energy and intentions</h3></div><div class="grid cols2"><div class="field"><label>Yesterday’s screen time (optional)</label><input id="pScreen" value="${esc(p.screenYesterday||'')}" placeholder="e.g. 3h 20m"></div><div class="field"><label>Today’s screen-time intention</label><select id="pScreenGoal"><option value="">Choose (optional)</option>${['Reduce from yesterday','Stay around the same','No target today','Custom target'].map(x=>`<option ${p.screenGoal===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Custom screen-time target</label><input id="pScreenTarget" value="${esc(p.screenTarget||'')}" placeholder="Optional"></div><div class="grid cols2"><div class="field"><label>Energy level</label><select id="pEnergy">${['Low','Medium','High'].map(x=>`<option ${p.energy===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Current headspace</label><select id="pHeadspace">${['Motivated','Okay','Unmotivated','Stressed','Other'].map(x=>`<option ${p.headspace===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${sectionDayFields(p)}<div class="field"><label>Character trait you’d like to practise</label><input id="pTrait" value="${esc(p.trait||'')}" placeholder="Optional — e.g. patience, focus, courage"></div><div class="field"><label>Protected free time</label><input id="pProtected" value="${esc(p.protected||'')}" placeholder="What would you like to leave room for?"></div><div class="field"><label>Extra context for today</label><textarea id="pContext" placeholder="Anything else that might affect your plan…">${esc(p.context||'')}</textarea></div><div class="field"><label>Night report preference</label><select id="pNightMode"><option ${p.nightMode!=='Night debrief only'?'selected':''}>Day planner + night debrief</option><option ${p.nightMode==='Night debrief only'?'selected':''}>Night debrief only</option></select></div><div class="field"><label>Report length</label><select id="pLength">${['Short','Summary','Normal','Long'].map(x=>`<option ${p.reportLength===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="btn" onclick="saveMorning()">Build my day planner</button><button class="secondary" onclick="clearDayPlanner()">Clear form</button></div></section>${p.report?`<div class="planner-panel"><div class="row"><h3>📋 Your day plan</h3><button class="secondary" onclick="togglePinnedReport('${today()}','planner')">${isPinned(today(),'planner')?'★ Saved':'☆ Save this plan'}</button></div>${plannerTable(p)}<div class="planner-output">${esc(p.report)}</div><div class="planner-actions"><button class="secondary" onclick="copyTodayPlanner()">Copy day planner</button></div></div>`:`<div class="mutedbox planner-status"><b>Planner isn’t generated yet.</b> Fill in what you know, then build your day plan.</div>`}<div class="checkin">The timetable is a draft you can adjust. It should fit your life, not dictate it.</div>`}
function captureDayPlanner(){let d=day(),p=d.dayPlanner||{};p.wakeTime=document.getElementById('pWake').value;p.dayType=document.querySelector('input[name="dayType"]:checked')?.value||'Flexible day';p.dayNote=document.getElementById('pDayNote').value;p.regularPlanIds=Array.from(document.querySelectorAll('input[name="regularPlan"]:checked')).map(x=>x.value);p.freeTime=document.getElementById('pFree').value;p.bedTime=document.getElementById('pBed').value;p.daySchedule=document.getElementById('pDaySchedule').value;p.priority=document.getElementById('pPriority').value;p.tasks=document.getElementById('pTasks').value;p.weeklyGoal=document.getElementById('pGoal').value;p.weeklyStatus=document.getElementById('pGoalStatus').value;p.screenYesterday=document.getElementById('pScreen').value;p.screenGoal=document.getElementById('pScreenGoal').value;p.screenTarget=document.getElementById('pScreenTarget').value;p.energy=document.getElementById('pEnergy').value;p.headspace=document.getElementById('pHeadspace').value;p.trait=document.getElementById('pTrait').value;p.protected=document.getElementById('pProtected').value;p.context=document.getElementById('pContext').value;p.nightMode=document.getElementById('pNightMode').value;p.reportLength=document.getElementById('pLength').value;document.querySelectorAll('[data-extra]').forEach(x=>p[x.dataset.extra]=x.value);p.focus=p.tasks;d.dayPlanner=p;return d}
function saveMorning(){let d=captureDayPlanner(),p=d.dayPlanner;d.plannedTasks=selectedTasks().map(t=>({...t}));p.report=plannerTextValue(p);p.generatedAt=new Date().toISOString();p.saved=true;save();notify('Day planner generated and saved on this device.');render()}
function clearDayPlanner(){if(confirm('Clear today’s day planner draft? Your saved reports and checklist will stay in history.')){day().dayPlanner={};save();render()}}
function copyTodayPlanner(){let p=day().dayPlanner;copyText(p?.report||plannerTextValue(p||{}),'Day planner copied.')}
function taskChoices(name,selected=[]){let items=day().plannedTasks.length?day().plannedTasks:selectedTasks();return items.map((t,i)=>`<label class="option"><input type="checkbox" name="${name}" value="${i}" ${selected.includes(t.id)||selected.includes(String(i))?'checked':''}>${esc(t.label)} <span class="tiny">${esc(t.group||'')}</span></label>`).join('')||'<p class="sub">No daily intentions are set up yet. You can add them in Settings.</p>'}
function sectionPromptField(s,i,d){let choices=(s.details?.choices||'').split('\n').map(x=>x.trim()).filter(Boolean),answer=d.evening?.answers?.[s.name]||'';return `<div class="field"><label>${esc(s.details.question)}</label>${choices.length?`<select data-section-answer="${i}"><option value="">Choose an answer (optional)</option>${choices.map(x=>`<option ${answer===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<textarea data-section-answer="${i}" placeholder="Your answer, if you want to write one…">${esc(answer)}</textarea>`}</div>`}
function mainEveningPage(){let d=day(),e=d.evening||{},prompts=data.sections.filter(s=>s.enabled&&s.details?.question),sl=data.sleep[today()]||{};return `<div class="report-header"><span class="report-badge">NOTICE · LEARN · RESET</span><h2>🌙 Night Debrief</h2><p>Look back honestly and kindly. Carry forward only what still matters.</p></div><div class="notice">Your answers stay on this device. There are no scores or streak penalties.</div><section class="card"><h3>1. What did you complete today?</h3><div class="option-grid">${taskChoices('doneTask',e.completedIds||[])}</div><div class="field"><label>Anything else you completed?</label><input id="eDoneOther" value="${esc(e.completedOther||'')}" placeholder="Optional"></div><h3>2. What did you partly complete?</h3><div class="option-grid">${taskChoices('partialTask',e.partialIds||[])}</div><div class="field"><label>What should carry forward?</label><textarea id="eCarry" placeholder="Add any unfinished task you still want to do…">${esc(e.carry||'')}</textarea></div><div class="field"><label>Actual screen time today (optional)</label><input id="eScreen" value="${esc(e.screenTime||'')}" placeholder="e.g. 3h 17m"></div><div class="field"><label>Biggest win today</label><input id="eWin" value="${esc(e.win||'')}" placeholder="A small effort counts"></div><div class="field"><label>One thing to adjust tomorrow</label><input id="eImprove" value="${esc(e.improve||'')}" placeholder="Be honest, not harsh"></div><div class="field"><label>How is your weekly goal going?</label><select id="eWeekly"><option value="">Choose (optional)</option>${['On track','Partly on track','Fell behind','Need to reassess','No weekly goal'].map(x=>`<option ${e.weeklyStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid cols2"><div class="field"><label>Need to wake up early tomorrow?</label><select id="eEarly">${['Not sure','Yes','No'].map(x=>`<option ${e.early===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tomorrow’s first priority</label><input id="ePriority" value="${esc(e.firstPriority||'')}" placeholder="One useful next step"></div></div><div class="field"><label>Tomorrow’s schedule change</label><input id="eTomorrowSchedule" value="${esc(e.tomorrowSchedule||'')}" placeholder="Optional — event, appointment, day off"></div>${prompts.map((s,i)=>sectionPromptField(s,i,e)).join('')}${(data.customQs||[]).map((q,i)=>`<div class="field"><label>${esc(q)}</label><textarea data-custom-answer="${i}">${esc(e.customAnswers?.[i]||'')}</textarea></div>`).join('')}<div class="field"><label>Anything else on your mind?</label><textarea id="eAnything" placeholder="Optional">${esc(e.anything||'')}</textarea></div><div class="field"><label>Debrief length</label><select id="eLength">${['Short','Summary','Normal','Long'].map(x=>`<option ${e.reportLength===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="btn" onclick="saveEvening()">Generate night debrief</button><button class="secondary" onclick="clearEvening()">Clear answers</button></div></section>${e.report?`<div class="planner-panel"><div class="row"><h3>📊 Your debrief</h3><button class="secondary" onclick="togglePinnedReport('${today()}','debrief')">${isPinned(today(),'debrief')?'★ Saved':'☆ Save this report'}</button></div><div class="planner-output">${esc(e.report)}</div><div class="planner-actions"><button class="secondary" onclick="copyTodayDebrief()">Copy debrief</button></div></div>`:''}<div class="checkin">You can learn from today without judging yourself for it.</div>`}
function saveEvening(){let d=day(),planned=d.plannedTasks.length?d.plannedTasks:selectedTasks(),readChecks=name=>Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(x=>String(x.value)),answers={};data.sections.filter(s=>s.enabled&&s.details?.question).forEach((s,i)=>answers[s.name]=document.querySelector(`[data-section-answer="${i}"]`)?.value||'');let customAnswers={};(data.customQs||[]).forEach((_,i)=>customAnswers[i]=document.querySelector(`[data-custom-answer="${i}"]`)?.value||'');let e={completedIds:readChecks('doneTask'),partialIds:readChecks('partialTask'),completedOther:document.getElementById('eDoneOther').value,carry:document.getElementById('eCarry').value,screenTime:document.getElementById('eScreen').value,win:document.getElementById('eWin').value,improve:document.getElementById('eImprove').value,weeklyStatus:document.getElementById('eWeekly').value,early:document.getElementById('eEarly').value,firstPriority:document.getElementById('ePriority').value,tomorrowSchedule:document.getElementById('eTomorrowSchedule').value,answers,customAnswers,anything:document.getElementById('eAnything').value,reportLength:document.getElementById('eLength').value,saved:true};e.completed=e.completedIds.map(i=>planned[Number(i)]?.label).filter(Boolean);e.partials=e.partialIds.map(i=>planned[Number(i)]?.label).filter(Boolean);e.report=buildNightReport(e);e.generatedAt=new Date().toISOString();d.evening=e;save();notify('Night debrief generated and saved.');render()}
function buildNightReport(e){let sleep=data.sleep[today()]||{},title=`${data.appName||'Personal planner'} · Night Debrief · ${dateLabel()}`,lines=[title,'',`Completed: ${[...(e.completed||[]),e.completedOther].filter(Boolean).join(', ')||'Nothing marked yet'}`,`Partly completed: ${(e.partials||[]).join(', ')||'None noted'}`,`Carry forward: ${e.carry||'Nothing added'}`,`Actual screen time: ${e.screenTime||'Not recorded'}`,`Biggest win: ${e.win||'—'}`,`Adjust tomorrow: ${e.improve||'—'}`,`Weekly goal: ${e.weeklyStatus||'—'}`,`Wake early tomorrow: ${e.early||'—'}`,`Tomorrow’s first priority: ${e.firstPriority||'—'}`,`Schedule change: ${e.tomorrowSchedule||'—'}`];Object.entries(e.answers||{}).forEach(([k,v])=>lines.push(`${k}: ${v||'—'}`));(data.customQs||[]).forEach((q,i)=>{if(e.customAnswers?.[i])lines.push(`${q}: ${e.customAnswers[i]}`)});if(sleep.hours)lines.push(`Sleep logged: ${sleep.hours} hours · bedtime ${sleep.bedAt||'—'} · wake-up ${sleep.wakeAt||'—'}`);if(e.anything)lines.push(`On my mind: ${e.anything}`);if(e.reportLength==='Short')return [title,`Win: ${e.win||'—'}`,`First priority tomorrow: ${e.firstPriority||'—'}`,`Carry forward: ${e.carry||'None'}`].join('\n');if(e.reportLength==='Summary')return lines.slice(0,8).join('\n');return lines.join('\n')+`\n\nThis local report was created from the user's own entries.`}
